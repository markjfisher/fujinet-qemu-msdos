[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fujinet-qemu-msdos-tools"
version = "0.1.0"
description = "Build MS-DOS qcow2 images with FUJINET.SYS and optional app injection"
requires-python = ">=3.10"
dependencies = [
  "PyYAML~=6.0.3",
]

[tool.setuptools]
package-dir = {"" = "py"}

[tool.setuptools.packages.find]
where = ["py"]

[project.scripts]
fujinet-qemu-msdos = "fujinet_qemu_msdos.cli:main"
